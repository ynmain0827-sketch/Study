<style>
:root{--paper:#E4E2DA;--paper-2:#EDEBE4;--paper-3:#F5F4EF;--ink:#16181C;--ink-60:rgba(22,24,28,.6);
--ink-35:rgba(22,24,28,.35);--rule:rgba(22,24,28,.14);--shu:#A6392E;--ao:#2F6B5E;--cha:#8C6A4A;--px:44px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
font-feature-settings:"tnum" 1;line-height:1.5;padding:20px 14px 70px;max-width:1120px;margin:0 auto}
.mincho,h1,h2{font-family:"Shippori Mincho B1",serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--ink-60);margin-bottom:5px}
h1{font-size:clamp(20px,5vw,28px);font-weight:700}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;border-left:3px solid var(--shu);padding:6px 0 6px 11px;margin:14px 0}
.count .n{font-family:"Shippori Mincho B1",serif;font-size:30px;font-weight:700;line-height:1}
.count .l{font-size:11px;color:var(--ink-60)}.count .l b{color:var(--ink)}
.count .t{width:100%;font-size:11px;color:var(--ink-60)}.count .t b{font-family:"Shippori Mincho B1",serif;font-size:16px;color:var(--ink)}
.rounds{border:1px solid var(--ink);margin-bottom:14px}
.rrow{display:grid;grid-template-columns:3.3em 5.2em 1fr auto 5em;gap:6px;align-items:baseline;padding:6px 10px;border-bottom:1px dotted var(--rule);font-size:12px}
.rrow:last-child{border-bottom:0}
.rrow.cur{box-shadow:inset 3px 0 0 var(--shu);background:linear-gradient(90deg,rgba(166,57,46,.06),transparent 70%)}
.rrow .rn{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:13px}
.rrow .rl,.rrow .rp{font-size:10.5px;color:var(--ink-60)}.rrow .rp{color:var(--ink-35)}
.rrow .rv{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:14px;text-align:right}
.rrow .rv small{font-size:10px;font-weight:400;color:var(--ink-35);margin-left:1px}
.rrow .rd{font-size:10.5px;text-align:right;color:var(--ink-35)}.rd.plus{color:var(--ao)}.rd.minus{color:var(--shu)}
.panel{border:1px solid var(--rule);background:var(--paper-2);padding:10px 12px;margin-bottom:14px}
.p-date{font-size:12px;color:var(--ink-60);margin-bottom:5px}
.p-date b{color:var(--ink);font-size:15px;font-family:"Shippori Mincho B1",serif}
.p-date .hol{color:var(--shu);margin-left:6px;font-size:11px}
.sec{font-size:9.5px;letter-spacing:.12em;color:var(--ink-35);margin:7px 0 3px;padding-top:6px;border-top:1px dotted var(--rule)}
.sec:first-of-type{border-top:0;padding-top:0}
.d-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}
.d-row i{width:3px;height:15px;border-radius:1px;flex:none}
.d-row .sub{font-size:11px;color:var(--ink-35)}
.d-row .tg{background:transparent;border:1px solid var(--rule);font-size:10px;padding:3px 9px;color:var(--ink-60);flex:none;margin-left:auto;white-space:nowrap}
.d-row .tg[aria-pressed="true"]{background:var(--ao);border-color:var(--ao);color:#fff}
.tabs{display:flex;border:1px solid var(--ink);width:fit-content;margin-bottom:12px;max-width:100%}
.tabs button{background:transparent;border:0;border-right:1px solid var(--ink);font-size:12px;padding:6px 13px;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.month{margin-bottom:22px}
.month h2{font-size:15px;letter-spacing:.1em;padding-bottom:5px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow div{font-size:10px;color:var(--ink-35);text-align:center;padding:2px 0}.dow div:first-child{color:var(--shu)}
.cell{position:relative;background:var(--paper-2);border:1px solid transparent;aspect-ratio:1/1.06;
padding:3px 3px 3px 5px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px}
.cell.off,.cell.blank{background:transparent}
.cell.blank{box-shadow:inset 0 0 0 1px rgba(22,24,28,.05)}
.cell .dnum{font-size:11px;font-weight:500;color:var(--ink-60);font-family:"Shippori Mincho B1",serif}
.cell.sun .dnum,.cell.hol .dnum{color:var(--shu)}
.cell .row{display:flex;align-items:center;gap:2px;font-size:9px;line-height:1.25}
.cell .row b{font-weight:700;font-size:10px}
.cell .row .dot{width:3px;height:9px;border-radius:1px;flex:none}
.cell .ev{margin-top:auto;display:flex;flex-direction:column;gap:1px}
.cell .ev span{font-size:8px;line-height:1.25;letter-spacing:-.04em;color:#fff;background:#4B3F72;
padding:1px 2px;border-radius:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell .ev span.kijutsu{background:var(--cha)}.cell .ev span.moshi,.cell .ev span.honshi{background:var(--shu)}
.cell .ev span.milestone{background:var(--ao)}
.cell[aria-pressed="true"]{border-color:var(--ink)}
.cell.today::after{content:"";position:absolute;inset:2px;border:1.5px solid var(--shu);pointer-events:none}
.cell .done1{position:absolute;right:3px;top:2px;font-size:8px;color:var(--ao);font-weight:700;font-family:"Shippori Mincho B1",serif}
.view{display:none}.view.on{display:block}
.jump{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.jump button{background:transparent;border:1px solid var(--rule);color:var(--ink-60);font-size:11px;padding:5px 10px}
details.grp{margin-bottom:12px;border-top:1px solid var(--ink)}
details.grp>summary{list-style:none;cursor:pointer;padding:7px 0 4px;display:flex;gap:8px;align-items:baseline}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"＋";font-size:11px;color:var(--ink-60);width:1em;flex:none}
details.grp[open]>summary::before{content:"－"}
details.grp>summary h3{font-size:12px;letter-spacing:.08em}
details.grp>summary .gc{font-size:10px;color:var(--ink-35);margin-left:auto;white-space:nowrap}
.cap{font-size:10px;color:var(--ink-35);margin-bottom:6px}
.grp2{margin-bottom:18px}
.grp2>h3{font-size:12px;letter-spacing:.08em;border-top:1px solid var(--ink);padding-top:6px;margin-bottom:2px}
.lday{border-bottom:1px dotted var(--rule);padding:6px 0 8px}
.lday.isToday{background:linear-gradient(90deg,rgba(166,57,46,.07),transparent 60%);box-shadow:inset 3px 0 0 var(--shu);padding-left:8px}
.lhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.lhead .ld{font-size:11px;color:var(--ink-60);width:62px;flex:none}
.lhead .lt{font-size:11px;color:var(--ink-35);flex:1;line-height:1.35}
.lhead .lc{font-size:12px;font-weight:700;white-space:nowrap}.lhead .lc.full{color:var(--ao)}
.lhead .all{background:transparent;border:1px solid var(--rule);font-size:10px;padding:2px 7px;color:var(--ink-60)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{width:31px;height:26px;border:1px solid var(--rule);background:var(--paper-2);font-size:10px;
color:var(--ink-60);border-radius:2px;display:flex;align-items:center;justify-content:center;padding:0}
.chip[aria-checked="true"]{color:#fff;border-color:transparent;font-weight:700}
.secmark{width:100%;font-size:9.5px;color:var(--ink-35);margin:4px 0 1px}
.srow{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.srow.done{color:var(--ink-35)}
.srow .sd{width:84px;flex:none;font-size:11px;color:var(--ink-60)}
.srow .st{flex:1}.srow .st em{font-style:normal;font-size:10.5px;color:var(--ink-35);display:block}
.srow .sb{background:transparent;border:1px solid var(--rule);font-size:10px;padding:3px 9px;color:var(--ink-60);flex:none}
.srow .sb[aria-pressed="true"]{background:var(--ao);border-color:var(--ao);color:#fff}
.note{font-size:11px;color:var(--ink-35);line-height:1.5;padding:8px 0}
/* ---- vertical ---- */
.vnav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.vnav button{background:transparent;border:1px solid var(--rule);color:var(--ink-60);font-size:12px;padding:4px 10px}
.vnav .wk{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:13px;flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnav button{flex:none}
.vax span:first-child{transform:none}.vax span:last-child{transform:translateY(-100%)}
.vt-wrap{overflow:auto;max-height:72vh;border:1px solid var(--ink);background:var(--paper-3);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.vt{display:grid;grid-template-columns:30px repeat(7,minmax(74px,1fr));min-width:548px}
.vh{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--ink);border-left:1px solid var(--rule);
padding:4px 3px 3px;font-size:10px;text-align:center;line-height:1.25;cursor:pointer;z-index:3}
.vh:first-child{border-left:0;cursor:default;position:sticky;left:0;z-index:5}
.vh b{display:block;font-family:"Shippori Mincho B1",serif;font-size:13px}
.vh.sun,.vh.hol{color:var(--shu)}.vh .hn{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh.today{background:var(--ink);color:var(--paper)}.vh.sel{box-shadow:inset 0 -3px 0 var(--shu)}
.vax{position:sticky;left:0;z-index:3;background:var(--paper-3);height:calc(var(--px)*24);border-right:1px solid var(--rule)}
.vax span{position:absolute;right:3px;font-size:9px;color:var(--ink-35);transform:translateY(-50%)}
.vcol{position:relative;height:calc(var(--px)*24);border-left:1px solid var(--rule);
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--px) - 1px),var(--rule) calc(var(--px) - 1px),var(--rule) var(--px))}
.vcol.today{background-color:rgba(166,57,46,.04)}
.vbuf{position:absolute;left:0;right:0;background:repeating-linear-gradient(-45deg,rgba(166,57,46,.10) 0 4px,transparent 4px 9px);z-index:0}
.vbuf span{position:absolute;right:3px;bottom:2px;font-size:8.5px;color:rgba(166,57,46,.75)}
.vb{position:absolute;left:2px;width:calc(100% - 4px);border-radius:2px;padding:1px 3px 1px 5px;overflow:hidden;z-index:1;
font-size:9px;line-height:1.22;text-align:left;border:1px solid transparent;display:block;color:var(--ink)}
.vb .k{font-size:8px;letter-spacing:.04em;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.vb .c{display:block;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.vb .nw{white-space:nowrap}
.vb .n{position:absolute;right:3px;top:1px;font-size:8px;opacity:.8}
.vb.desk{background:#fff;border-color:var(--ink);border-left-width:4px}
.vb.gap{background:rgba(255,255,255,.65);border:1px dashed var(--ink-35);border-left:3px solid var(--ink-35)}
.vb.kijutsu{background:var(--cha);color:#fff}
.vb.seiri{background:rgba(47,107,94,.16);border-color:rgba(47,107,94,.4);color:var(--ao)}
.vb.work{background:rgba(22,24,28,.06);color:var(--ink-35);text-align:center;cursor:default}
.vb.off{background:transparent;border:1px dotted var(--rule);color:var(--ink-35);text-align:center;cursor:default}
.vb.exam{background:var(--shu);color:#fff}
.vb.done{opacity:.45}.vb.done .n{opacity:1;font-weight:700}
.vb.tiny{padding-top:0;padding-bottom:0;line-height:1.05}.vb.tiny .k,.vb.tiny .n{display:none}
.vb.tiny .c{font-size:8px;white-space:nowrap}
.vb.short .k,.vb.short .n{display:none}.vb.short .c{font-size:8.5px;line-height:1.15}
.vb .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}.vb .dots i{width:6px;height:6px;border:1px solid var(--ink-35);border-radius:1px;background:#fff}
.vb.tiny .dots{display:none}.vb.short .dots{margin-top:1px}
.vb.open{outline:2px solid var(--shu);outline-offset:-1px;z-index:2}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--ink);box-shadow:0 -8px 20px rgba(22,24,28,.14);max-height:55vh;overflow:auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet[hidden]{display:none}.sheet .in{max-width:1092px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}.sh-h b{font-family:"Shippori Mincho B1",serif;font-size:15px}
.sh-h .x{margin-left:auto;background:transparent;border:1px solid var(--ink);font-size:12px;padding:3px 11px}
.sh-s{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-60);margin-bottom:6px}
.sh-s .all{background:transparent;border:1px solid var(--rule);font-size:10px;padding:2px 8px;color:var(--ink-60)}
.sh-s .lc{font-weight:700;color:var(--ink);font-size:12px}.sh-s .lc.full{color:var(--ao)}
.vnow{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--shu);z-index:2;pointer-events:none}
.vnow::before{content:"";position:absolute;left:-3px;top:-4px;width:6px;height:6px;border-radius:50%;background:var(--shu)}
.vlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--ink-60);margin:8px 0}
.vlegend i{display:inline-block;width:14px;height:10px;vertical-align:-1px;margin-right:4px;border-radius:1px}
#vpanel{margin-top:10px}
footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
footer p{font-size:11px;color:var(--ink-35)}footer .btns{display:flex;gap:6px}
footer button{background:transparent;border:1px solid var(--rule);color:var(--ink-60);font-size:11px;padding:5px 10px}
@media (max-width:520px){.cell{padding:2px 2px 2px 4px}.cell .row{font-size:8px}.cell .row b{font-size:9px}
.chip{width:30px;height:28px}.lhead{flex-wrap:wrap}.lhead .lt{width:100%;order:3}
.srow{flex-wrap:wrap}.srow .st{width:100%;order:3}
.rrow{grid-template-columns:3.1em 1fr auto 4.6em;row-gap:0}.rrow .rp{grid-column:2;grid-row:2;margin-top:-2px}
.tabs button{padding:6px 10px}}
</style></head><body>
